[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "AI support agent for the Customer Support on Twitter dataset — Hiver SDE Intern take-home."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "PyYAML>=6.0,<7",
    "pydantic>=2.9,<3",
    "python-dateutil>=2.9,<3",
    "numpy>=1.26,<2",
    "scikit-learn>=1.5,<2",
    "pyarrow>=17.0,<18",
    "faiss-cpu>=1.15,<2",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
# Production-only embedder for src.intent.embedding.SentenceTransformerEmbedder
# (used by both intent classification and retrieval). Not required by the
# test suite, which uses the offline HashingEmbedder.
embeddings = ["sentence-transformers>=3.2,<4"]
# Production-only LLM provider for src.agent.llm.OpenAIProvider. Not
# required by the test suite, which uses the deterministic MockLLMProvider.
openai = ["openai>=1.54,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: slower subprocess-based end-to-end tests"]
